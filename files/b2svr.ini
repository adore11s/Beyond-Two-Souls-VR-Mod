; Beyond: Two Souls VR mod - settings
; This file sits next to the game's exe. The installer never overwrites it.
; Changes take effect the next time the game starts.

[b2svr]
; on  = VR starts by itself a few seconds after the game starts
; off = the game starts on your monitor; press F9 to switch VR on (and off again)
xr=on

; Frame rate limit. 0 = off (recommended: the headset sets the pace), a number = cap at that
; many frames per second, game = the game's own 30/60 cap (turned off anyway while VR runs)
fps=0

; VSync on the monitor. off = recommended; game = the game's own setting (always off in VR)
vsync=off

; First person when the game starts (otherwise switch with F1 / F3 in the game):
;   firstperson = first person while you control Jodie (F1)
;   fpcutscenes = first person in cutscenes (F3)
firstperson=off
fpcutscenes=off

; In first person, your VR controllers move Jodie's arms (on), or her arms stay animated
; by the game (off)
fparms=on

; First-person view position, in metres from the top of Jodie's neck: forward / up.
; Raise fp_eye_up if the view feels too low; raise fp_eye_fwd if her hair or neck shows in view.
fp_eye_fwd=0.09
fp_eye_up=0.07

; First-person hands: tilt Jodie's hands (degrees). Positive points her fingers further down,
; negative further up, if her hands do not match how you hold your controllers.
fp_wrist_pitch=0

; First person (F1 / F3): words and choices the game shows at Jodie's head (a name to call out,
; dialogue choices) are shown in front of you instead, where you can see them.
fp_prompts_on_hand=on

; Lights: which lights are used is decided for a view a bit wider than both eyes, so lamps do not
; switch on and off as you turn your head. 1 = exactly the eyes' view; higher = more margin.
light_cull_margin=1.35
; Lights near you are never dropped because you look away from them: the light check looks from
; this many metres behind your eyes in every direction. 0 = the game's own view-based check.
light_cull_back=10

; Controller buttons the game shows: xbox or playstation. F10 / F11 in game switch it and save it here.
; With playstation, prompts that need the controller's motion sensor read your right VR controller.
controller=xbox

; Game builds. The mod knows the game addresses of one verified build and finds them by
; signature in any other build (Epic Games Store, other updates). on = stay off on every build
; except the verified one.
verified_build_only=off
; force = search by signature even on the verified build (testing).
signature_scan=off

; on = a small always-on-top desktop window shows the seconds since the game started (the same
; times as b2svr_logs\b2svr.log), handy for screen recordings of a problem.
timer_window=off
