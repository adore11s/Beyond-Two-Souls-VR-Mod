; Beyond: Two Souls VR mod - settings
; This file sits next to the game's exe. The installer never overwrites it.
; Most of these are also in the VR settings panel (open the game's pause menu in VR), which saves
; them here at once. Changes made in this file take effect the next time the game starts.

[b2svr]
; on  = VR starts by itself a few seconds after the game starts
; off = the game starts on your monitor; press F9 to switch VR on (and off again)
xr=on

; Frame rate limit. 0 = off (recommended: the headset sets the pace), a number = cap at that
; many frames per second, game = the game's own 30/60 cap (turned off anyway while VR runs)
fps=0

; VSync on the monitor. off = recommended; game = the game's own setting (always off in VR)
vsync=off

; Rendering method: native = both eyes every frame (the default); afr = one eye per frame, alternating
; (lighter on the graphics card; the other eye shows its last picture); mono = one picture from the middle
; of the head for both eyes (fastest, no 3D depth). VR settings: Rendering method.
rendering_method=native

; 3D sound is heard from your head (in first person: from Jodie's head), on; off = from the game's camera.
audio_head=on

; VR picture size: while VR runs the game draws a square picture of this many pixels per side for
; each eye, whatever your monitor's resolution. Bigger = sharper but slower. auto = the size your
; headset asks for. off = the game's own resolution. Needs the game in Windowed mode (the installer
; sets it). VR settings: VR picture size.
render_size=2048
; While VR runs, the game's window on your monitor is 16:9, this many pixels high (720 = 1280 x 720; the headset
; still gets its full picture). Drag its edges, maximize or snap it as you like: it stays 16:9 and your size is kept
; for next time (desktop_window_h). 0 = leave the window as the game makes it.
desktop_window=720
; 1 = the 3D view fills the window (its top and bottom are cut off on the monitor only); 0 = black bars instead.
desktop_crop=1

; Turning with the right stick in first person (F1): smooth, or snap (snap_turn_degrees per push).
; turn_speed: smooth turning speed, 1 = 120 degrees a second. VR settings: Turning, Turning speed /
; Snap angle.
turn=smooth
turn_speed=1
snap_turn_degrees=45

; First person (switch with F1 / F3, or your right hand at your head + B / O, or the VR settings):
;   firstperson = first person while you control Jodie (F1)
;   fpcutscenes = first person in cutscenes (F3)
firstperson=on
fpcutscenes=off
; Set once by the installer (first person while walking on, in cutscenes off; rendering method Native) - your own changes are kept.
installer_defaults=3

; Aiden's possessions: on = while Aiden possesses someone, first person (F1) follows that person instead
; of Jodie (while you walk them and while the game animates them); off (the default) = first person
; stays with Jodie. VR settings: Aiden possessions.
fp_possession=off

; Motion controls: in first person, your VR controllers move Jodie's arms (on), or her arms stay
; animated by the game (off). VR settings: Motion controls.
fparms=on

; With motion controls in first person, Jodie's hands are smoothed a little so they do not tremble
; (fast moves still follow at once; the game and the gestures always get your raw controller
; movement). off = raw hands.
hand_smoothing=on

; With motion controls in first person, Jodie's fingers follow how you hold the controller: grip closes
; middle, ring and little finger, the trigger the index finger; on controllers with finger touch (Quest
; Touch, PS VR2 Sense through SteamVR, Index) lifting the index points; the thumb closes with the grip only
; (touching or lifting it does not move it). While her hand holds an item her fingers play the game's own grip. off = her fingers keep
; one calm pose. fp_fingers_rest_shape: on = her fingers start from her model's own relaxed hand (no
; finger movement from the idle / walking animations); off = from the animation's fingers.
fp_fingers=on
fp_fingers_rest_shape=on

; Third-person camera closer: the game's own camera moves this many metres forward (0 .. 2), toward the
; characters, so it stays inside the room more often. Never closer than 0.75 m in front of Jodie; first
; person is not affected. VR settings: Camera closer (third person).
camera_forward=0

; First-person view position, in metres from the top of Jodie's neck: forward / up.
; Raise fp_eye_up if the view feels too low; raise fp_eye_fwd if her hair or neck shows in view.
fp_eye_fwd=0.09
fp_eye_up=0.07

; First person: Jodie's head (head, face, teeth, hair). cutscene = hidden in first-person cutscenes (F3),
; drawn while you walk her (F1, you see it in mirrors); show = always drawn; hide = always hidden.
fp_head=cutscene

; First-person hands: tilt Jodie's hands (degrees). Positive points her fingers further down,
; negative further up, if her hands do not match how you hold your controllers.
; For one kind of headset only, add wristpitch_psvr2=, wristpitch_quest= or wristpitch_other=
; (the log line "FP wrist angle for ..." names yours).
fp_wrist_pitch=0

; First person (F1 / F3): words and choices the game shows at Jodie's head (a name to call out,
; dialogue choices) are shown in front of you instead, where you can see them.
fp_prompts_on_hand=on

; Lights: which lights are used is decided for a view a bit wider than both eyes, so lamps do not
; switch on and off as you turn your head. 1 = exactly the eyes' view; higher = more margin.
light_cull_margin=1.35
; Lights near you are never dropped because you look away from them: the light check looks from
; this many metres behind your eyes in every direction. 0 = the game's own view-based check.
light_cull_back=10
; Light glows (street lights, lamps): vr = in VR every light is drawn in both eyes (the game's
; visibility test for far lights only skips work and made some glows show in one eye only);
; game = the game's own test.
light_occlusion=vr
; Mirrors and reflections: eye = each eye draws them with its own previous view (they no longer slide when you
; move your head); game = the game's own (one set shared by both eyes).
mirror_prev_view=eye

; Controller buttons the game shows: xbox or playstation. F10 / F11 or the VR settings switch it
; and save it here. With playstation, prompts that need the controller's motion sensor read your
; right VR controller.
controller=xbox

; Game builds. The mod knows the game addresses of one verified build and finds them by
; signature in any other build (Epic Games Store, other updates). on = stay off on every build
; except the verified one.
verified_build_only=off
; force = search by signature even on the verified build (testing).
signature_scan=off

; Troubleshooting: off = the 0.21.7 fix for black furniture / beds / ground is not used (they can turn black
; again). Only to test whether a problem goes away without it.
texture_refill=on
